# Проверки на каждый push и pull request: линтер и тесты.
#
# Тесты не ходят ни в Telegram, ни в кабинет — кабинет заменён фикстурами,
# снятыми с живого ответа, база — SQLite в памяти. Поэтому CI не требует
# секретов и проходит за минуту.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
        # 3.10 — локальная разработка, 3.12 — образ в Docker: код обязан
        # работать в обоих, иначе «у меня работает» гарантировано.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Установить зависимости
        run: pip install -e ".[dev]"

      - name: Линтер
        run: ruff check app tests

      - name: Тесты
        run: pytest -q
