[project]
name = "ikanam-schedule"
version = "0.1.0"
description = "Telegram-бот с расписанием РАНХиГС и подпиской в календарь"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.15",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "cryptography>=43",
    "apscheduler>=3.10",
    "icalendar>=6.0",
    "aiohttp-socks>=0.9",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "respx>=0.21"]

[tool.setuptools.packages.find]
# Пакет — только `app`. Без этого setuptools находит рядом `migrations` и
# отказывается собирать: «Multiple top-level packages discovered».
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# В тестах длинные строки с фикстурами и однобуквенные `l` в генераторах
# читаются лучше, чем их переносы. В текстах бота строка — это фраза целиком.
"tests/*" = ["E501", "E741"]
"app/bot/texts.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
